---
ignore: |
  archive/
  custom_components/
  themes/
  .storage/
  esphome/.esphome/
rules:
  braces:
    level: error
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    level: error
    min-spaces-inside: 0
    max-spaces-inside: 0
  colons:
    level: error
    max-spaces-before: 0
    max-spaces-after: 1
  commas:
    level: error
    max-spaces-before: 0
    min-spaces-after: 1
    max-spaces-after: 1
  comments:
    level: warning
    require-starting-space: true
    min-spaces-from-content: 1
  comments-indentation: disable
  document-end:
    level: error
    present: false
  document-start: disable
  empty-lines:
    level: error
    max: 2
    max-start: 0
    max-end: 1
  hyphens:
    level: error
    max-spaces-after: 1
  indentation:
    level: error
    spaces: 2
    indent-sequences: whatever
    check-multi-line-strings: false
  key-duplicates:
    level: error
  line-length: disable
  new-line-at-end-of-file:
    level: error
  new-lines:
    level: error
    type: unix
  trailing-spaces: disable
  truthy:
    level: error
    allowed-values: ['true', 'false', 'yes', 'no', 'on', 'off']
    check-keys: false
